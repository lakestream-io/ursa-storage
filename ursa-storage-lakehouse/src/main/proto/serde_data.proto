syntax = "proto3";
package serde.proto;

option java_multiple_files = true;
option java_package = "io.lakestream.ursa.lakehouse.serde.proto";
option java_outer_classname = "SerdeData";

message Data {
  int32 index = 1;
  string name = 2;
  map<int32, string> tags = 3;
}

