syntax = "proto2";

package lakestream.proto;
option java_package = "io.lakestream.ursa.lakestream.proto";
option optimize_for = LITE_RUNTIME;

enum CompressionType {
  NONE = 0;
  LZ4 = 1;
  ZLIB = 2;
  ZSTD = 3;
  SNAPPY = 4;
}

message IndividualAcksSegment {
  required int64 base_offset = 1;
  required bytes bitmap = 2;
  optional CompressionType compression = 3;
  optional int32 original_size = 4;
}
