# This configuration file is used for compaction service.

# metadataStoreUrl stores stream, schema, and materialization metadata.
# Example: oxia://127.0.0.1:6648/default
# This one is required
# metadataStoreUrl=

# metadataStoreConfig is optional Oxia client configuration JSON for metadataStoreUrl.
# Example: {"enableTls":"true","authPluginClassName":"io.oxia.client.auth.TokenAuthentication","authParams":"token:xxx"}
# metadataStoreConfig=

# oxiaStorageUrl stores Ursa WAL metadata and indexes.
# Example: oxia://127.0.0.1:6648/default
# This one is required
# oxiaStorageUrl=

# oxiaStorageConfig is optional Oxia client configuration JSON for oxiaStorageUrl.
# Example: {"enableTls":"true","authPluginClassName":"io.oxia.client.auth.TokenAuthentication","authParams":"token:xxx"}
# oxiaStorageConfig=

# schemaRegistryUrl is the Confluent-compatible registry used by Kafka materialization.
# Example: http://127.0.0.1:8001
# This one is required
# schemaRegistryUrl=

# schemaRegistryHttpHeaderAuthorization is the optional registry authorization header,
# which is used to access the schema registry.
# This one is optional
# schemaRegistryHttpHeaderAuthorization=

# Ursa storage backend storage type: S3 or LOCAL.
backendStorageType=S3

# s3Bucket is the bucket used to store the WAL file. It is used when the backendStorageType is S3.
# The bucket is used for S3Client and it should not add any `s3://` or `s3a://` prefix
# It is required
# s3Bucket=

# s3Prefix is the prefix used to store the WAL file. It is used when the backendStorageType is S3.
# It is optional
# s3Prefix=

# compactBackendStorageType is define the compact target storage type, if not set, use backendStorageType as the default.
# compactBackendStorageType=S3

# compactionBucket is the bucket used to store the compaction data. It is used when the compactBackendStorageType is S3 or Azure
# It is required
# compactionBucket=

# compactionPrefix is the prefix used to store the compaction data. It is used when the compactBackendStorageType is S3 or Azure
# It is optional
# compactionPrefix=

# The number of threads used to compact the topics. Default is CPU * 2
#compactedThreadNum=

# The WAL storage type. Available values are SIMPLE and COMPOSITE. Default is SIMPLE.
# walStorageType=SIMPLE

# The publish task runner will check the stream available compacted message range size,
# it use checkCompactMessageStepLength to get the next entry header to check the available message total size.
# Default is 10000.
# checkCompactMessageStepLength=10000

# Whether this compactor publishes compaction tasks internally. Disable this when an external scheduler owns
# task publication. Default is true.
# internalCompactionTaskPublisherEnabled=true

# Config the parquet file message size is less than maxCompactedFileSizeLimit.
# Default is 256MB
# compactedFileSizeLimit=268435456

#The tail compact data visibility interval in seconds.
# If there is no new messages comes in, the compact data will be visible after this interval. Default is 180 seconds.
# tailCompactDataVisibilityIntervalInSeconds=180

# The maximum number of entries that can be read in one round from WAL during the compaction.
# For one compaction round, it will read multiple times from WAL files. Default is 4000.
# perReadMaxEntriesOfCompact=4000

# The compaction service class name, which is used to compact the topics. Available values are:
# - io.lakestream.ursa.lakehouse.compact.LakehouseCompactionServiceImpl
# - io.lakestream.ursa.storage.impl.compaction.CompactionServiceImpl
# compactionServiceClass=io.lakestream.ursa.lakehouse.compact.LakehouseCompactionServiceImpl

# The refresh topic interval in seconds
# The compaction worker will detect new topics that need to be compacted with this interval. Default is 60 seconds
# refreshLocalTopicInternalInSeconds=60

# The refresh tasks interval in seconds.
# The compaction worker will detect the tasks that need to be compacted with this interval. Default is 10 seconds
# refreshLocalTaskInternalInSeconds=30

# Quarantine retryable task in seconds. Default is 60.
# retryableQuarantineInSeconds=60

# Quarantine non retryable task in seconds. Default is 300.
# nonRetryableQuarantineInSeconds=300

# Default S3 client request concurrency
cloudStorageMaxConcurrencyRequest=100

# Because the compaction main read from the wal. Decrease the number of write buffer segment to avoid allocating
# unnecessary memory.
writeBufferSegment=1

# The s3 ops rate limit per second.
s3OpsRateLimitPerSecond=250

# The cloud storage ops rate limit per second.
cloudStorageOpsRateLimitPerSecond=250

# Persistent API read cache auto expire time in milliseconds. Default is 10 seconds.
# Disable the cache by setting it to -1 in compaction service
readCacheExpiredTimeMs=-1

### Lakehouse Configurations ###
# Lakehouse table partition key. Default is __partition
partitionKey=__partition

# Idle timeout in seconds for ParquetFileReader instances.
# After this timeout, idle readers will be closed to release S3A HTTP connections.
# Set to 0 to disable idle timeout. Default is 300 seconds (5 minutes).
lakehouseReaderIdleTimeoutSeconds=60

# The catalog max open time in seconds. Default is 100 years (never expire).
# After this period, we will close and reopen the catalog to avoid potential token refresh issues.
# After run this feature for a period, we will change the default value to 20 minutes.
catalogMaxOpenTimeInSeconds=1200

# The number of bytes in one Google Cloud Storage upload request via the MediaHttUploader
# class. This is used only for JSON API and for best performance should be a multiple of 8 MiB.
# Having a large value like 64 MiB allows the upload to Cloud Storage to be faster due to
# smaller number of HTTP requests needed for upload. But on the other side if there are many
# files (partitions) being written at the same time then each file will hold 64 MiB buffer
# in memory, i.e. if 250 files are written at once then the total memory requirement will
# be 250 * 64 MiB = 16 GiB of memory, which may result in OOM.
# It should be enabled if you have large files and disabled the direct upload.
# hadoop.fs.gs.outputstream.upload.chunk.size=8388608


# https://developers.google.com/api-client-library/java/google-api-java-client/media-upload
# Direct media upload uploads the whole file in one HTTP request, as opposed to the resumable
# media upload protocol, which uploads the file in multiple requests. Doing a direct upload
# reduces the number of HTTP requests but increases the chance of failures (such as connection
# failures) that can happen with large uploads.
hadoop.fs.gs.outputstream.direct.upload.enable=true
