syntax = "proto2";

package storage.proto;
option java_package = "io.lakestream.ursa.storage.proto";
option optimize_for = LITE_RUNTIME;

enum CompressionType {
  NONE = 0; // not supported yet
  FastPFOR = 1; // default
  ZSTD = 2; // not supported yet
}

enum FileType {
  RAW = 0;
  PARQUET = 1;
}

enum IndexType {
  NORMAL = 0;
  COMPACT = 1;
}

// Each version identify new features that are
// incrementally added to the protocol
enum Version {
  v3 = 3;
}

message ExtraData {
  optional string key = 1;
  optional string value = 2;
}

message EntryIndex {
  // all fields are optional as recommended in https://protobuf.dev/programming-guides/proto2/
  // `Required is Strongly Deprecated`
  optional Version version = 1;
  optional string location = 2;
  optional FileType file_type = 3;
  optional IndexType index_type = 4;
  optional int32 message_count = 5;
  optional int64 entry_size_bytes = 6;
  optional int64 file_size = 7;
  optional int64 offset_in_file = 8;
  optional int32 entry_count = 9;
  optional EntryOffsets entry_offsets = 10;
  repeated ExtraData extraData = 11;
}


message EntryOffsets {
  optional CompressionType compression_type = 1; // FastPFOR by default
  optional int32 uncompressed_size = 2;
  optional bytes compressed_payload = 3;
}
